      <div class="drawer-header">

<div class="container mt-5">

  <form>
    <div class="row">
      <div class="form-field md:col-6 mb-3 mt-5">
        <label for="exampleInputFirstName" class="form-label">First Name</label>
        <input type="text" class="form-control" id="exampleInputFirstName">
      </div>

      <div class="form-field md:col-6 mb-3 mt-5">
        <label for="exampleInputLastName" class="form-label">Last Name</label>
        <input type="text" class="form-control" id="exampleInputLastName">
      </div>
    </div>

    <div class="form-field mb-3 mt-5">
      <label for="exampleInputEmail1" class="form-label">Email address</label>
      <input type="email" class="form-control" id="exampleInputEmail1" placeholder="name@example.com">
      <div id="emailHelp" class="form-text">We’ll never share your email with anyone else.</div>
    </div>

    <div class="form-field mb-3">
      <label class="form-label" for="inputGroupSelect01">Program</label>
      <select class="form-control" id="inputGroupSelect01">
        <option selected>Choose...</option>
        <option value="1">DEM</option>
        <option value="2">CCIT</option>
        <option value="3">PWC</option>
      </select>
    </div>

    <div class="form-field">
      <label for="exampleFormControlTextarea2" class="form-label">Leave your comments here:</label>
      <textarea class="form-control" id="exampleFormControlTextarea2" rows="4"></textarea>
    </div>

    <div class="mb-5 mt-5 form-field">
      <input type="checkbox" id="exampleCheck1" class="check">
      <label for="exampleCheck1">I agree to the Terms and Conditions.</label>
    </div>

    <button type="submit" class="btn-solid theme-primary">Submit</button>
  </form>
</div>

</body>
</html>
